{{- /* the pod webhooks only act when NodeLabelDelivery is on, so they are registered only then */ -}}
{{- if and .Values.webhooks.enabled (include "kuberay.nodeLabelDeliveryEnabled" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "kuberay-operator.fullname" . }}-mutating-webhook-configuration
  labels:
    {{- include "kuberay-operator.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kuberay-operator.webhook.certName" . }}
webhooks:
  # fails closed, so scoped to Ray worker pods
  - name: mpod.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "kuberay-operator.webhook.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-v1-pod
    failurePolicy: Fail
    objectSelector:
      matchLabels:
        ray.io/node-type: worker
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    sideEffects: None
  - name: mpodbinding.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "kuberay-operator.webhook.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-v1-pod-binding
    failurePolicy: Ignore
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
    sideEffects: NoneOnDryRun
    timeoutSeconds: 5
{{- end }}
