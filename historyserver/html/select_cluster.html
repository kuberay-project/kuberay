<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray History Server - Select Session</title>
    <link rel="stylesheet" href="/select_cluster/select_cluster.css">
    <!-- Not deferred, so the theme is set before the page is drawn. -->
    <script src="/select_cluster/select_cluster.js"></script>
</head>
<body>
    <!-- The Ray dashboard's nav bar without the page links, which need a selected session. -->
    <nav class="nav-bar">
        <svg class="nav-logo" viewBox="0 0 144.5 144.6" role="img" aria-label="Ray">
            <linearGradient id="ray-logo-gradient" gradientUnits="userSpaceOnUse" x1="31.9659" y1="112.5396" x2="112.4544" y2="32.0512">

                <stop offset="0.9" stop-color="#0091EA"/>
            </linearGradient>
            <path fill="url(#ray-logo-gradient)" d="M97.3,77.2c-3.8-1.1-6.2,0.9-8.3,5.1c-3.5,6.8-9.9,9.9-17.4,9.6S58,88.1,54.8,81.2c-1.4-3-3-4-6.3-4.1c-5.6-0.1-9.9,0.1-13.1,6.4c-3.8,7.6-13.6,10.2-21.8,7.6C5.2,88.4-0.4,80.5,0,71.7c0.1-8.4,5.7-15.8,13.8-18.2c8.4-2.6,17.5,0.7,22.3,8c1.3,1.9,1.3,5.2,3.6,5.6c3.9,0.6,8,0.2,12,0.2c1.8,0,1.9-1.6,2.4-2.8c3.5-7.8,9.7-11.8,18-11.9c8.2-0.1,14.4,3.9,17.8,11.4c1.3,2.8,2.9,3.6,5.7,3.3c1-0.1,2,0.1,3,0c2.8-0.5,6.4,1.7,8.1-2.7s-2.3-5.5-4.1-7.5c-5.1-5.7-10.9-10.8-16.1-16.3C84,38,81.9,37.1,78,38.3C66.7,42,56.2,35.7,53,24.1C50.3,14,57.3,2.8,67.7,0.5C78.4-2,89,4.7,91.5,15.3c0.1,0.3,0.1,0.5,0.2,0.8c0.7,3.4,0.7,6.9-0.8,9.8c-1.7,3.2-0.8,5,1.5,7.2c6.7,6.5,13.3,13,19.8,19.7c1.8,1.8,3,2.1,5.5,1.2c9.1-3.4,17.9-0.6,23.4,7c4.8,6.9,4.6,16.1-0.4,22.9c-5.4,7.2-14.2,9.9-23.1,6.5c-2.3-0.9-3.5-0.6-5.1,1.1c-6.7,6.9-13.6,13.7-20.5,20.4c-1.8,1.8-2.5,3.2-1.4,5.9c3.5,8.7,0.3,18.6-7.7,23.6c-7.9,5-18.2,3.8-24.8-2.9c-6.4-6.4-7.4-16.2-2.5-24.3c4.9-7.8,14.5-11,23.1-7.8c3,1.1,4.7,0.5,6.9-1.7C91.7,98.4,98,92.3,104.2,86c1.6-1.6,4.1-2.7,2.6-6.2c-1.4-3.3-3.8-2.5-6.2-2.6C99.8,77.2,98.9,77.2,97.3,77.2z M72.1,29.7c5.5,0.1,9.9-4.3,10-9.8c0-0.1,0-0.2,0-0.3C81.8,14,77,9.8,71.5,10.2c-5,0.3-9,4.2-9.3,9.2c-0.2,5.5,4,10.1,9.5,10.3C71.8,29.7,72,29.7,72.1,29.7z M72.3,62.3c-5.4-0.1-9.9,4.2-10.1,9.7c0,0.2,0,0.3,0,0.5c0.2,5.4,4.5,9.7,9.9,10c5.1,0.1,9.9-4.7,10.1-9.8c0.2-5.5-4-10-9.5-10.3C72.6,62.3,72.4,62.3,72.3,62.3z M115,72.5c0.1,5.4,4.5,9.7,9.8,9.9c5.6-0.2,10-4.8,10-10.4c-0.2-5.4-4.6-9.7-10-9.7c-5.3-0.1-9.8,4.2-9.9,9.5C115,72.1,115,72.3,115,72.5z M19.5,62.3c-5.4,0.1-9.8,4.4-10,9.8c-0.1,5.1,5.2,10.4,10.2,10.3c5.6-0.2,10-4.9,9.8-10.5c-0.1-5.4-4.5-9.7-9.9-9.6C19.6,62.3,19.5,62.3,19.5,62.3z M71.8,134.6c5.9,0.2,10.3-3.9,10.4-9.6c0.5-5.5-3.6-10.4-9.1-10.8c-5.5-0.5-10.4,3.6-10.8,9.1c0,0.5,0,0.9,0,1.4c-0.2,5.3,4,9.8,9.3,10C71.6,134.6,71.7,134.6,71.8,134.6z"/>
        </svg>
        <span class="nav-title">History Server</span>
        <span class="nav-actions">
            <button id="refresh" class="icon-button" type="button" aria-label="Refresh sessions" data-tooltip="Refresh sessions">
                <svg class="icon" viewBox="0 0 24 24"><path d="M5.46257 4.43262C7.21556 2.91688 9.5007 2 12 2C17.5228 2 22 6.47715 22 12C22 14.1361 21.3302 16.1158 20.1892 17.7406L17 12H20C20 7.58172 16.4183 4 12 4C9.84982 4 7.89777 4.84827 6.46023 6.22842L5.46257 4.43262ZM18.5374 19.5674C16.7844 21.0831 14.4993 22 12 22C6.47715 22 2 17.5228 2 12C2 9.86386 2.66979 7.88416 3.8108 6.25944L7 12H4C4 16.4183 7.58172 20 12 20C14.1502 20 16.1022 19.1517 17.5398 17.7716L18.5374 19.5674Z"/></svg>
            </button>
            <button id="theme-toggle" class="icon-button" type="button">
                <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M10 7C10 10.866 13.134 14 17 14C18.9584 14 20.729 13.1957 21.9995 11.8995C22 11.933 22 11.9665 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C12.0335 2 12.067 2 12.1005 2.00049C10.8043 3.27098 10 5.04157 10 7ZM4 12C4 16.4183 7.58172 20 12 20C15.0583 20 17.7158 18.2839 19.062 15.7621C18.3945 15.9187 17.7035 16 17 16C12.0294 16 8 11.9706 8 7C8 6.29648 8.08133 5.60547 8.2379 4.938C5.71611 6.28423 4 8.9417 4 12Z"/></svg>
                <svg class="icon icon-sun" viewBox="0 0 24 24"><path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"/></svg>
            </button>
            <a class="icon-button" href="https://docs.ray.io/en/latest/cluster/kubernetes/user-guides/kuberay-history-server.html" target="_blank" rel="noopener noreferrer" aria-label="Docs" data-tooltip="Docs">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 18.5V5C3 3.34315 4.34315 2 6 2H20C20.5523 2 21 2.44772 21 3V21C21 21.5523 20.5523 22 20 22H6.5C4.567 22 3 20.433 3 18.5ZM19 20V17H6.5C5.67157 17 5 17.6716 5 18.5C5 19.3284 5.67157 20 6.5 20H19ZM10 4H6C5.44772 4 5 4.44772 5 5V15.3368C5.45463 15.1208 5.9632 15 6.5 15H19V4H17V12L13.5 10L10 12V4Z"/></svg>
            </a>
        </span>
    </nav>
    <!-- The row being opened may be on another page of the list. -->
    <div id="entering" class="linear-progress" role="progressbar" aria-label="Opening the Ray dashboard" hidden>
        <span class="linear-progress-bar"></span>
        <span class="linear-progress-bar"></span>
    </div>

    <main>
        <section class="card">
            <h1 class="card-title">CLUSTER SESSIONS</h1>
            <p class="text-secondary">Select a cluster session to replay and explore its historical Ray dashboard.</p>
            <div class="toolbar">
                <!-- An outlined text field with a floating label, like MUI's. -->
                <div class="text-field">
                    <input id="search" type="text" placeholder=" " autocomplete="off">
                    <label for="search">Filter clusters or sessions</label>
                    <fieldset aria-hidden="true"><legend><span>Filter clusters or sessions</span></legend></fieldset>
                    <span class="adornment">
                        <svg id="search-icon" class="icon" viewBox="0 0 24 24"><path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"/></svg>
                        <button id="clear-search" class="icon-button small" type="button" aria-label="Clear filter" hidden>
                            <svg class="icon" viewBox="0 0 24 24"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"/></svg>
                        </button>
                    </span>
                </div>
                <!-- The initial state is in the markup too, so the first paint shows it without a transition. -->
                <div class="toggle-group" role="group" aria-label="Session status">
                    <button class="toggle" type="button" data-status="all" aria-pressed="true">All</button>
                    <button class="toggle" type="button" data-status="live" aria-pressed="false">Live</button>
                    <button class="toggle" type="button" data-status="ended" aria-pressed="false">Ended</button>
                </div>
            </div>

            <div id="loading" class="loading">
                <svg class="spinner" viewBox="22 22 44 44" role="progressbar" aria-label="Loading sessions"><circle cx="44" cy="44" r="20.2" fill="none" stroke-width="3.6"/></svg>
            </div>
            <div id="load-error" class="alert" role="alert" hidden>
                <svg class="alert-icon" viewBox="0 0 24 24"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
                <span class="alert-message"></span>
            </div>
            <div id="sessions" hidden>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th><button class="sort-label" type="button" data-sort="name">Cluster Name<svg class="sort-icon" viewBox="0 0 24 24"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/></svg></button></th>
                                <th><button class="sort-label" type="button" data-sort="namespace">Namespace<svg class="sort-icon" viewBox="0 0 24 24"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/></svg></button></th>
                                <th><button class="sort-label" type="button" data-sort="status">Session Status<svg class="sort-icon" viewBox="0 0 24 24"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/></svg></button></th>
                                <th><button class="sort-label" type="button" data-sort="owner">Owner<svg class="sort-icon" viewBox="0 0 24 24"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/></svg></button></th>
                                <th aria-sort="descending"><button class="sort-label" type="button" data-sort="createdAt">Created At<svg class="sort-icon" viewBox="0 0 24 24"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/></svg></button></th>
                            </tr>
                        </thead>
                        <tbody id="session-rows"></tbody>
                    </table>
                </div>
                <div class="table-footer">
                    <span id="showing" class="caption text-secondary"></span>
                    <nav id="pagination" class="pagination" aria-label="pagination navigation"></nav>
                </div>
            </div>
        </section>
    </main>

    <div id="enter-error" class="snackbar" hidden>
        <div class="alert filled" role="alert">
            <svg class="alert-icon" viewBox="0 0 24 24"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
            <span class="alert-message"></span>
            <span class="alert-action">
                <button id="close-enter-error" class="icon-button small" type="button" aria-label="Close">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </span>
        </div>
    </div>
    <div id="tooltip" class="tooltip" hidden></div>

    <template id="session-row">
        <tr class="session-row">
            <td>
                <span class="cluster-name">
                    <a class="link"></a>
                    <svg class="spinner small" viewBox="22 22 44 44" role="progressbar" hidden><circle cx="44" cy="44" r="20.2" fill="none" stroke-width="3.6"/></svg>
                </span>
            </td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    </template>
    <template id="empty-row">
        <tr>
            <td class="empty" colspan="5">
                <p class="empty-title"></p>
                <p class="empty-detail text-secondary"></p>
            </td>
        </tr>
    </template>
    <template id="page-arrows">
        <svg class="page-arrow" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        <svg class="page-arrow" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </template>
</body>
</html>
