apiVersion: v1
kind: Service
metadata:
  name: historyserver
  labels:
    app: historyserver
spec:
  selector:
    app: historyserver
  ports:
  - protocol: TCP
    name: http
    port: 30080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: historyserver-demo
  labels:
    app: historyserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: historyserver
  template:
    metadata:
      labels:
        app: historyserver
    spec:
      serviceAccountName: historyserver
      containers:
      - name: historyserver
        env:
        - name: AZURE_STORAGE_CONNECTION_STRING
          value: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite-service.azurite-dev.svc.cluster.local:10000/devstoreaccount1;"
        - name: AZURE_STORAGE_CONTAINER
          value: "ray-historyserver"
        image: historyserver:v0.1.0
        imagePullPolicy: IfNotPresent
        command:
        - historyserver
        - --storage-backend=azureblob
        ports:
        - containerPort: 8080
        # Cache is soft-bounded at 8 GiB; 12 GiB leaves decode headroom.
        # The 2 GiB request keeps examples schedulable; size production requests to residency.
        args:
        - --session-cache-max-memory=8Gi
        # Enable access to live RayClusters through the History Server.
        # - --enable-live-clusters=true
        #
        # Enable proxying to live RayClusters with token authentication enabled.
        # The history server reads the auth Secret and forwards requests with the
        # appropriate authorization header. Requires the RBAC in
        # service_account_auth_token_mode.yaml.
        # - --use-auth-token-mode=true
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            memory: "12Gi"
