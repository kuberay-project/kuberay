apiVersion: v1
kind: Namespace
metadata:
  name: rustfs-dev
---
# 1. Secrets for Login
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-creds
  namespace: rustfs-dev
type: Opaque
stringData:
  accessKey: rustfsadmin  # CHANGE THIS
  secretKey: rustfsadmin  # CHANGE THIS
---
# 2. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: rustfs-dev
  labels:
    app: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.0
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-creds
              key: accessKey
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-creds
              key: secretKey
        ports:
        - containerPort: 9000 # API Port
        - containerPort: 9001 # Console UI Port, served at /rustfs/console/
      # E2E tests exec the AWS CLI in this container to verify bucket contents.
      - name: aws-cli
        image: amazon/aws-cli:2.37.6
        command: ["sleep", "infinity"]
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: rustfs-creds
              key: accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-creds
              key: secretKey
        - name: AWS_ENDPOINT_URL
          value: http://localhost:9000
        - name: AWS_DEFAULT_REGION
          value: us-east-1
---
# 3. Service
apiVersion: v1
kind: Service
metadata:
  name: rustfs-service
  namespace: rustfs-dev
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
