# Sample RayJob with the collector sidecar writing to Alibaba Cloud OSS.
#
# Prerequisites (on ACK):
#   1. Enable RRSA (RAM Roles for Service Accounts) on the ACK cluster and create a
#      RAM role whose trust policy allows the cluster's OIDC provider.
#   2. Grant the RAM role read/write access to the OSS bucket.
#   3. Install the ack-pod-identity-webhook, annotate the ServiceAccount below with
#      the RAM role, and keep the `pod-identity.alibabacloud.com/injection` pod label
#      so the ALIBABA_CLOUD_* credential env vars are injected automatically.
#      (Alternatively, set ALIBABA_CLOUD_ROLE_ARN, ALIBABA_CLOUD_OIDC_PROVIDER_ARN,
#      and ALIBABA_CLOUD_OIDC_TOKEN_FILE on the collector containers yourself.)
#
# Apply with envsubst to substitute environment variables:
#   envsubst < historyserver/config/rayjob-aliyunoss.yaml | kubectl apply -f -
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: rayjob-historyserver-aliyunoss
spec:
  entrypoint: python /home/ray/samples/sample_code.py
  shutdownAfterJobFinishes: true
  # Keep the RayCluster alive long enough for the collector to gather data from the Ray node.
  ttlSecondsAfterFinished: 90
  rayClusterSpec:
    rayVersion: "2.58.0"
    headGroupSpec:
      rayStartParams:
        dashboard-host: 0.0.0.0
        num-cpus: "0"
      serviceType: ClusterIP
      template:
        metadata:
          labels:
            test: rayjob-historyserver-aliyunoss
            # Lets the ack-pod-identity-webhook inject the RRSA credential env vars.
            pod-identity.alibabacloud.com/injection: "on"
        spec:
          serviceAccountName: historyserver-aliyunoss
          containers:
          - env:
            - name: RAY_TMP_ROOT
              value: &rayTmpRoot /tmp/ray
            - name: RAY_enable_ray_event
              value: "true"
            - name: RAY_enable_core_worker_ray_event_to_aggregator
              value: "true"
            - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EVENTS_EXPORT_ADDR
              value: "http://localhost:8084/v1/events"
            - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EXPOSABLE_EVENT_TYPES
              value: "ALL"
            image: rayproject/ray:2.58.0
            imagePullPolicy: IfNotPresent
            name: ray-head
            resources:
              limits:
                cpu: "5"
                memory: 10G
              requests:
                cpu: "50m"
                memory: 1G
            volumeMounts:
            - name: historyserver
              mountPath: *rayTmpRoot
            - name: code-sample
              mountPath: /home/ray/samples
          - name: collector
            image: ${COLLECTOR_IMAGE}
            imagePullPolicy: IfNotPresent
            env:
            - name: RAY_CLUSTER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['ray.io/cluster']
            - name: RAY_CLUSTER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FQ_RAY_IP
              value: $(RAY_CLUSTER_NAME)-head-svc.$(RAY_CLUSTER_NAMESPACE).svc.cluster.local
            - name: RAY_TMP_ROOT
              value: *rayTmpRoot
            # Region such as cn-hangzhou.
            - name: OSS_REGION
              value: "${OSS_REGION}"
            - name: OSS_BUCKET
              value: "${OSS_BUCKET}"
            # Endpoint such as oss-cn-hangzhou-internal.aliyuncs.com.
            - name: OSS_ENDPOINT
              value: "${OSS_ENDPOINT}"
            - name: RAY_ROLE
              value: "Head"
            - name: OWNER_KIND
              value: "rayjob"
            - name: OWNER_NAME
              value: "rayjob-historyserver-aliyunoss"
            - name: STORAGE_BACKEND
              value: "aliyunoss"
            volumeMounts:
            - name: historyserver
              mountPath: *rayTmpRoot
          volumes:
          - name: historyserver
            emptyDir: {}
          - name: code-sample
            configMap:
              name: ray-job-code-sample
              items:
              - key: sample_code.py
                path: sample_code.py
    workerGroupSpecs:
    - groupName: cpu
      maxReplicas: 1000
      minReplicas: 1
      numOfHosts: 1
      rayStartParams: {}
      replicas: 1
      template:
        metadata:
          labels:
            test: rayjob-historyserver-aliyunoss
            # Lets the ack-pod-identity-webhook inject the RRSA credential env vars.
            pod-identity.alibabacloud.com/injection: "on"
        spec:
          serviceAccountName: historyserver-aliyunoss
          containers:
          - env:
            - name: RAY_TMP_ROOT
              value: *rayTmpRoot
            - name: RAY_enable_ray_event
              value: "true"
            - name: RAY_enable_core_worker_ray_event_to_aggregator
              value: "true"
            - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EVENTS_EXPORT_ADDR
              value: "http://localhost:8084/v1/events"
            - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EXPOSABLE_EVENT_TYPES
              value: "ALL"
            image: rayproject/ray:2.58.0
            imagePullPolicy: IfNotPresent
            name: ray-worker
            resources:
              limits:
                cpu: "2"
                memory: 2G
              requests:
                cpu: "50m"
                memory: 1G
            volumeMounts:
            - name: historyserver
              mountPath: *rayTmpRoot
          - name: collector
            image: ${COLLECTOR_IMAGE}
            imagePullPolicy: IfNotPresent
            env:
            - name: RAY_CLUSTER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['ray.io/cluster']
            - name: RAY_CLUSTER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FQ_RAY_IP
              value: $(RAY_CLUSTER_NAME)-head-svc.$(RAY_CLUSTER_NAMESPACE).svc.cluster.local
            - name: RAY_TMP_ROOT
              value: *rayTmpRoot
            - name: OSS_REGION
              value: "${OSS_REGION}"
            - name: OSS_BUCKET
              value: "${OSS_BUCKET}"
            - name: OSS_ENDPOINT
              value: "${OSS_ENDPOINT}"
            - name: RAY_ROLE
              value: "Worker"
            - name: OWNER_KIND
              value: "rayjob"
            - name: OWNER_NAME
              value: "rayjob-historyserver-aliyunoss"
            - name: STORAGE_BACKEND
              value: "aliyunoss"
            volumeMounts:
            - name: historyserver
              mountPath: *rayTmpRoot
          volumes:
          - name: historyserver
            emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: historyserver-aliyunoss
  annotations:
    # Replace with the RAM role created for RRSA; the ack-pod-identity-webhook uses
    # this to inject ALIBABA_CLOUD_* credential env vars into labeled pods.
    pod-identity.alibabacloud.com/role-name: "${RAM_ROLE_NAME}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-job-code-sample
data:
  sample_code.py: |
    import ray
    import time
    from ray.util.placement_group import placement_group

    ray.init()

    # --- Scenario 1: Root-level NORMAL_TASK (single call) ---
    @ray.remote(num_cpus=0.1)
    def my_task(x):
        # NOTE: Add this to ensure will produce log.out
        print(f"Processing {x}", flush=True)
        return x * 2

    # --- Scenario 2: Nested tasks (parent spawns child) ---
    # Tests lineage tree depth > 1: child_task is nested under parent_task.
    @ray.remote(num_cpus=0.1)
    def parent_task():
        result = ray.get(child_task.remote())
        return result

    @ray.remote(num_cpus=0.1)
    def child_task():
        print("Child task", flush=True)
        return 42

    # --- Scenario 3: Multiple same-name tasks ---
    # Tests GROUP merging in lineage: 3 calls to the same function
    # are merged into a single GROUP node.
    @ray.remote(num_cpus=0.1)
    def repeated_task(x):
        return x

    # --- Scenario 4: Actor (creation + method calls) ---
    @ray.remote(num_cpus=0.1)
    class Counter:
        def __init__(self):
            self.count = 0

        def increment(self):
            self.count += 1
            return self.count

        def get_count(self):
            return self.count

    # Execute all scenarios:
    task_result = ray.get(my_task.remote(1))
    print(f"Task result: {task_result}")

    nested_result = ray.get(parent_task.remote())
    print(f"Nested result: {nested_result}")

    refs = [repeated_task.remote(i) for i in range(3)]
    results = ray.get(refs)
    print(f"Repeated results: {results}")

    counter = Counter.remote()
    for i in range(2):
        count = ray.get(counter.increment.remote())
        print(f"Counter: {count}")
    final_count = ray.get(counter.get_count.remote())
    print(f"Final count: {final_count}")

    print(f"Cluster resources: {ray.cluster_resources()}")

    # Create a detached placement group so it persists after the job exits.
    # This ensures the collector captures non-empty data when polling /api/v0/placement_groups.
    pg = placement_group([{"CPU": 0.5}], strategy="SPREAD", lifetime="detached", name="test_pg")
    ray.get(pg.ready())
    print(f"Placement group created: {pg.bundle_specs}")

    # Wait for events to flush to the collector
    time.sleep(5)
