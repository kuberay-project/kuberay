apiVersion: v1
kind: Service
metadata:
  name: historyserver #TODO: to specify your service name
  labels:
    app: historyserver
spec:
  selector:
    app: historyserver
  ports:
  - protocol: TCP
    name: http
    port: 30080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: historyserver-demo
  labels:
    app: historyserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: historyserver
  template:
    metadata:
      labels:
        app: historyserver
    spec:
      serviceAccountName: historyserver
      containers:
      - name: historyserver
        env:
          - name: S3DISABLE_SSL
            value: "true"
          - name: AWS_ACCESS_KEY_ID
            value: rustfsadmin
          - name: AWS_SECRET_ACCESS_KEY
            value: rustfsadmin
          - name: AWS_SESSION_TOKEN
            value: ""
          - name: S3_BUCKET
            value: "ray-historyserver"
          - name: S3_ENDPOINT
            value: "rustfs-service.rustfs-dev:9000"
          - name: S3_REGION
            value: "test"
          - name: S3FORCE_PATH_STYLE
            value: "true"
          - name: STORAGE_BACKEND
            value: "s3"
        image: historyserver:v0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        # Cache is soft-bounded at 8 GiB; 12 GiB leaves decode headroom.
        # The 2 GiB request keeps examples schedulable; size production requests to residency.
        args:
        - --session-cache-max-memory=8Gi
        # Enable access to live RayClusters through the History Server.
        # - --enable-live-clusters=true
        #
        # Enable proxying to live RayClusters with token authentication enabled.
        # The history server reads the auth Secret and forwards requests with the
        # appropriate authorization header. Requires the RBAC in
        # service_account_auth_token_mode.yaml.
        # - --use-auth-token-mode=true
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            memory: "12Gi"
