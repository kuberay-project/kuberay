apiVersion: ray.io/v1
kind: RayCluster
metadata:
  labels:
    ray.io/cluster: raycluster-historyserver-kubernetes-auth
  name: raycluster-historyserver-kubernetes-auth
spec:
  # enableK8sTokenAuth requires Ray 2.55.0+. authOptions.secretName must NOT be
  # set at the same time.
  rayVersion: '2.58.0'
  authOptions:
    mode: 'token'
    enableK8sTokenAuth: true
  headGroupSpec:
    rayStartParams:
      dashboard-host: 0.0.0.0
      num-cpus: "0"
    template:
      spec:
        serviceAccountName: raycluster-historyserver-kubernetes-auth
        containers:
        - name: ray-head
          imagePullPolicy: IfNotPresent
          image: rayproject/ray:2.58.0
          env:
          - name: RAY_TMP_ROOT
            value: &rayTmpRoot /tmp/ray
          - name: RAY_enable_ray_event
            value: "true"
          - name: RAY_enable_core_worker_ray_event_to_aggregator
            value: "true"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EVENTS_EXPORT_ADDR
            value: "http://localhost:8084/v1/events"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EXPOSABLE_EVENT_TYPES
            value: "ALL"
          resources:
            limits:
              cpu: "5"
              memory: "10Gi"
            requests:
              cpu: "50m"
              memory: "1Gi"
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          volumeMounts:
          - name: historyserver
            mountPath: *rayTmpRoot
        - name: collector
          image: collector:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
          - name: RAY_CLUSTER_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['ray.io/cluster']
          - name: RAY_CLUSTER_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: FQ_RAY_IP
            value: $(RAY_CLUSTER_NAME)-head-svc.$(RAY_CLUSTER_NAMESPACE).svc.cluster.local
          - name: RAY_TMP_ROOT
            value: *rayTmpRoot
          # RAY_DASHBOARD_ADDRESS is used by the head collector to fetch endpoints' results
          # (e.g., /api/v0/cluster_metadata) from the Ray Dashboard running in the same pod.
          # Only the head collector uses this; worker collectors do not need it.
          - name: RAY_DASHBOARD_ADDRESS
            value: "http://localhost:8265"
          - name: RAY_AUTH_MODE
            value: "token"
          - name: RAY_ENABLE_K8S_TOKEN_AUTH
            value: "true"
          - name: AWS_ACCESS_KEY_ID
            value: rustfsadmin
          - name: AWS_SECRET_ACCESS_KEY
            value: rustfsadmin
          - name: AWS_SESSION_TOKEN
            value: ""
          - name: S3_BUCKET
            value: "ray-historyserver"
          - name: S3_ENDPOINT
            value: "rustfs-service.rustfs-dev:9000"
          - name: S3_REGION
            value: "test"
          - name: S3FORCE_PATH_STYLE
            value: "true"
          - name: S3DISABLE_SSL
            value: "true"
          - name: RAY_ROLE
            value: "Head"
          - name: STORAGE_BACKEND
            value: "s3"
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          volumeMounts:
          - name: historyserver
            mountPath: *rayTmpRoot
          - name: ray-token
            mountPath: /var/run/secrets/ray.io/serviceaccount
            readOnly: true
        volumes:
        - name: historyserver
          emptyDir: {}
  workerGroupSpecs:
  - replicas: 1
    minReplicas: 1
    maxReplicas: 5
    groupName: workergroup
    rayStartParams: {}
    template:
      spec:
        serviceAccountName: raycluster-historyserver-kubernetes-auth
        containers:
        - name: ray-worker
          imagePullPolicy: IfNotPresent
          image: rayproject/ray:2.58.0
          env:
          - name: RAY_TMP_ROOT
            value: *rayTmpRoot
          - name: RAY_enable_ray_event
            value: "true"
          - name: RAY_enable_core_worker_ray_event_to_aggregator
            value: "true"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EVENTS_EXPORT_ADDR
            value: "http://localhost:8084/v1/events"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EXPOSABLE_EVENT_TYPES
            value: "ALL"
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "50m"
              memory: "1Gi"
          volumeMounts:
          - name: historyserver
            mountPath: *rayTmpRoot
        - name: collector
          image: collector:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
          - name: RAY_CLUSTER_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['ray.io/cluster']
          - name: RAY_CLUSTER_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: FQ_RAY_IP
            value: $(RAY_CLUSTER_NAME)-head-svc.$(RAY_CLUSTER_NAMESPACE).svc.cluster.local
          - name: RAY_TMP_ROOT
            value: *rayTmpRoot
          - name: RAY_AUTH_MODE
            value: "token"
          - name: RAY_ENABLE_K8S_TOKEN_AUTH
            value: "true"
          - name: AWS_ACCESS_KEY_ID
            value: rustfsadmin
          - name: AWS_SECRET_ACCESS_KEY
            value: rustfsadmin
          - name: AWS_SESSION_TOKEN
            value: ""
          - name: S3_BUCKET
            value: "ray-historyserver"
          - name: S3_ENDPOINT
            value: "rustfs-service.rustfs-dev:9000"
          - name: S3_REGION
            value: "test"
          - name: S3FORCE_PATH_STYLE
            value: "true"
          - name: S3DISABLE_SSL
            value: "true"
          - name: RAY_ROLE
            value: "Worker"
          - name: STORAGE_BACKEND
            value: "s3"
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          volumeMounts:
          - name: historyserver
            mountPath: *rayTmpRoot
          - name: ray-token
            mountPath: /var/run/secrets/ray.io/serviceaccount
            readOnly: true
        volumes:
        - name: historyserver
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: raycluster-historyserver-kubernetes-auth
---
# The Ray Dashboard runs TokenReview/SubjectAccessReview to validate incoming
# tokens, so the cluster's ServiceAccount needs permission to create them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ray-authenticator
rules:
- apiGroups: ["authentication.k8s.io"]
  resources:
  - 'tokenreviews'
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources:
  - 'subjectaccessreviews'
  verbs: ["create"]
---
# Grants the caller ray:write on rayclusters, which is what the Dashboard
# authorizes the presented token against.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ray-writer
rules:
- apiGroups: ["ray.io"]
  resources:
  - 'rayclusters'
  verbs: ["ray:write"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ray-authenticator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ray-authenticator
subjects:
- kind: ServiceAccount
  name: raycluster-historyserver-kubernetes-auth
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raycluster-historyserver-kubernetes-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ray-writer
subjects:
- kind: ServiceAccount
  name: raycluster-historyserver-kubernetes-auth
  namespace: default
