apiVersion: ray.io/v1
kind: RayCluster
metadata:
  labels:
    ray.io/cluster: raycluster-historyserver
  name: raycluster-historyserver
  namespace: default
spec:
  # Enable Ray token authentication. Requires Ray 2.52.0+
  # rayVersion: "2.58.0"
  # authOptions:
  #   mode: token
  headGroupSpec:
    rayStartParams:
      dashboard-host: 0.0.0.0
      num-cpus: "0"
    serviceType: ClusterIP
    template:
      metadata:
        labels:
          test: raycluster-historyserver
      spec:
        containers:
        - env:
          - name: RAY_TMP_ROOT
            value: &rayTmpRoot /tmp/ray
          - name: RAY_enable_ray_event
            value: "true"
          - name: RAY_enable_core_worker_ray_event_to_aggregator
            value: "true"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EVENTS_EXPORT_ADDR
            value: "http://localhost:8084/v1/events"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EXPOSABLE_EVENT_TYPES
            value: "ALL"
          image: rayproject/ray:2.58.0
          imagePullPolicy: IfNotPresent
          name: ray-head
          resources:
            limits:
              cpu: "5"
              memory: 10G
            requests:
              cpu: "50m"
              memory: 1G
          volumeMounts:
          - name: historyserver
            mountPath: *rayTmpRoot
        - name: collector
          image: collector:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
          - name: RAY_CLUSTER_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['ray.io/cluster']
          - name: RAY_CLUSTER_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: FQ_RAY_IP
            value: $(RAY_CLUSTER_NAME)-head-svc.$(RAY_CLUSTER_NAMESPACE).svc.cluster.local
          - name: RAY_TMP_ROOT
            value: *rayTmpRoot
          # Optional; defaults to http://localhost:8265 (head only).
          # - name: RAY_DASHBOARD_ADDRESS
          #   value: "http://localhost:9265"
          # Optional; defaults to 30s.
          # - name: RAY_COLLECTOR_POLL_INTERVAL
          #   value: "1m"
          # Optional extras on top of the built-in endpoints (Serve, placement groups, Ray Data).
          # Paths must match the History Server replay request URI, query string included.
          # For example, preserve Ray Train V2 run details for a future History Server view.
          # Requires the Ray Train workload/driver (not the collector) to set
          # RAY_TRAIN_V2_ENABLED=1 and RAY_TRAIN_ENABLE_STATE_TRACKING=1;
          # verify this DeveloperAPI URI when changing Ray versions.
          # - name: RAY_COLLECTOR_ADDITIONAL_ENDPOINTS
          #   value: "/api/train/v2/runs/v1"
          - name: S3DISABLE_SSL
            value: "true"
          - name: AWS_ACCESS_KEY_ID
            value: rustfsadmin
          - name: AWS_SECRET_ACCESS_KEY
            value: rustfsadmin
          - name: AWS_SESSION_TOKEN
            value: ""
          - name: S3_BUCKET
            value: "ray-historyserver"
          - name: S3_ENDPOINT
            value: "rustfs-service.rustfs-dev:9000"
          - name: S3_REGION
            value: "test"
          - name: S3FORCE_PATH_STYLE
            value: "true"
          - name: RAY_ROLE
            value: "Head"
          - name: STORAGE_BACKEND
            value: "s3"
          # Uncomment when the RayCluster sets `spec.authOptions.mode: token`; the collector
          # needs the token to call the Dashboard.
          # - name: RAY_AUTH_TOKEN
          #   valueFrom:
          #     secretKeyRef:
          #       name: raycluster-historyserver  # defaults to the RayCluster name
          #       key: auth_token
          volumeMounts:
          - name: historyserver
            mountPath: *rayTmpRoot
        volumes:
        - name: historyserver
          emptyDir: {}
  workerGroupSpecs:
  - groupName: cpu
    maxReplicas: 1000
    minReplicas: 1
    numOfHosts: 1
    # Keep one reusable Python worker so the task-log E2E can prove byte-range
    # isolation within a single physical worker log file.
    rayStartParams:
      num-cpus: "1"
    replicas: 1
    template:
      metadata:
        labels:
          test: raycluster-historyserver
      spec:
        containers:
        - env:
          - name: RAY_TMP_ROOT
            value: *rayTmpRoot
          - name: RAY_enable_ray_event
            value: "true"
          - name: RAY_enable_core_worker_ray_event_to_aggregator
            value: "true"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EVENTS_EXPORT_ADDR
            value: "http://localhost:8084/v1/events"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EXPOSABLE_EVENT_TYPES
            value: "ALL"
          image: rayproject/ray:2.58.0
          imagePullPolicy: IfNotPresent
          name: ray-worker
          resources:
            limits:
              cpu: "2"
              memory: 2G
            requests:
              cpu: "50m"
              memory: 1G
          volumeMounts:
          - name: historyserver
            mountPath: *rayTmpRoot
        - name: collector
          image: collector:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
          - name: RAY_CLUSTER_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['ray.io/cluster']
          - name: RAY_CLUSTER_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: FQ_RAY_IP
            value: $(RAY_CLUSTER_NAME)-head-svc.$(RAY_CLUSTER_NAMESPACE).svc.cluster.local
          - name: RAY_TMP_ROOT
            value: *rayTmpRoot
          - name: AWS_ACCESS_KEY_ID
            value: rustfsadmin
          - name: AWS_SECRET_ACCESS_KEY
            value: rustfsadmin
          - name: AWS_SESSION_TOKEN
            value: ""
          - name: S3_BUCKET
            value: "ray-historyserver"
          - name: S3_ENDPOINT
            value: "rustfs-service.rustfs-dev:9000"
          - name: S3_REGION
            value: "test"
          - name: S3FORCE_PATH_STYLE
            value: "true"
          - name: S3DISABLE_SSL
            value: "true"
          - name: RAY_ROLE
            value: "Worker"
          - name: STORAGE_BACKEND
            value: "s3"
          # Uncomment when the RayCluster sets `spec.authOptions.mode: token`; the collector
          # needs the token to call the Dashboard.
          # - name: RAY_AUTH_TOKEN
          #   valueFrom:
          #     secretKeyRef:
          #       name: raycluster-historyserver  # defaults to the RayCluster name
          #       key: auth_token
          volumeMounts:
          - name: historyserver
            mountPath: *rayTmpRoot
        volumes:
        - name: historyserver
          emptyDir: {}
