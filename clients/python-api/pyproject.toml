[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kuberay-api"
version = "0.0.0.dev0"
description = "Generated Pydantic v2 models for KubeRay CRDs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
keywords = ["kuberay", "ray", "kubernetes", "pydantic", "models"]

[project.urls]
Homepage = "https://github.com/ray-project/kuberay"
Repository = "https://github.com/ray-project/kuberay"

[tool.hatch.build.targets.wheel]
packages = ["kuberay_api"]
