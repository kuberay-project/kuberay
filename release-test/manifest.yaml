# Written by the release-test-plan skill and reviewed like code: one unit per Item in items.yaml.
# Commands use $KUBERAY_VERSION (the tag under test) and $CHART_VERSION (the same without the
# leading "v"), so the file carries over from one release to the next. `go run ./release-test stale
# --kuberay-version <tag>` lists the units whose source changed since they were planned (for a page,
# its code blocks); only those get re-planned.
units:
  - id: operator-installation
    source_sha: 990f1eb2b5a4bbba6d9318ec0f0961190f5b0a90
    notes:
      - "Step 1 (kind create cluster --image=kindest/node:v1.26.0) is left out: the runner owns the kind cluster"
      - "Method 1 and Method 2 are alternatives; the unit runs both, removing the Helm install (and its CRDs, which helm uninstall keeps) in between, and validates each with Step 3"
      - "The Step 3 checks also assert that the operator runs quay.io/kuberay/operator:$KUBERAY_VERSION, the image both the chart and the kustomization should point at"
      - "Method 2 clones the repository at $KUBERAY_VERSION, so its step gets 900s on a slow link to github.com"
      - "doc-bug (expected while planning, the run confirms it): ray-operator/config/default/kustomization.yaml sets namespace: default on every object, and kubectl create -n ray-system rejects an object whose namespace does not match ('does not match the namespace'), so Method 2 as written fails; its cluster-scoped objects (CRDs, ClusterRole, ClusterRoleBinding) are created before the error"
    steps:
      - name: "Method 1: Helm"
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          kubectl create namespace ray-system
          helm install kuberay-operator kuberay/kuberay-operator --version $CHART_VERSION -n ray-system
        check: kubectl wait deploy/kuberay-operator -n ray-system --for=condition=Available --timeout=300s
      - name: "Step 3: Validate the Helm installation"
        run: kubectl get pods -n ray-system
        check: |
          kubectl wait pod -n ray-system -l app.kubernetes.io/name=kuberay-operator --for=condition=Ready --timeout=60s
          test "$(kubectl get pods -n ray-system -o name | wc -l)" -eq 1
          test "$(kubectl get deploy kuberay-operator -n ray-system -o jsonpath='{.spec.template.spec.containers[0].image}')" = "quay.io/kuberay/operator:$KUBERAY_VERSION"
      - name: Remove the Helm installation before Method 2 (not on the page)
        run: |
          helm uninstall kuberay-operator -n ray-system --wait
          kubectl delete crd rayclusters.ray.io rayjobs.ray.io rayservices.ray.io raycronjobs.ray.io
          kubectl delete namespace ray-system
        check: |
          test -z "$(kubectl get crd -o name | grep '\.ray\.io$' || true)"
          ! kubectl get namespace ray-system
      - name: "Method 2: Kustomize"
        run: |
          kubectl create namespace ray-system
          kubectl create -k "github.com/ray-project/kuberay/ray-operator/config/default?ref=$KUBERAY_VERSION" -n ray-system
        check: kubectl wait deploy/kuberay-operator -n ray-system --for=condition=Available --timeout=300s
        timeout: 900
      - name: "Step 3: Validate the Kustomize installation"
        run: kubectl get pods -n ray-system
        check: |
          kubectl wait pod -n ray-system -l app.kubernetes.io/component=kuberay-operator --for=condition=Ready --timeout=60s
          test "$(kubectl get pods -n ray-system -o name | wc -l)" -eq 1
          test "$(kubectl get deploy kuberay-operator -n ray-system -o jsonpath='{.spec.template.spec.containers[0].image}')" = "quay.io/kuberay/operator:$KUBERAY_VERSION"
    cleanup:
      - helm uninstall kuberay-operator -n ray-system --wait
      - kubectl delete clusterrole,clusterrolebinding kuberay-operator --ignore-not-found
      - kubectl delete crd rayclusters.ray.io rayjobs.ray.io rayservices.ray.io raycronjobs.ray.io --ignore-not-found
      - kubectl delete namespace ray-system --ignore-not-found

  - id: raycluster-quick-start
    source_sha: f776b719838095587435abb97f95f0fec906f4f2
    notes:
      - "Step 1 (kind create cluster --image=kindest/node:v1.26.0) and Step 6 (killall kubectl; kind delete cluster) are left out: the runner owns the kind cluster and kills the port-forward"
      - "Step 2 follows the linked operator-installation page, Helm method, which installs into ray-system"
      - "kubectl exec -it runs as kubectl exec: the runner has no TTY"
      - "ray job submit runs in the head Pod against its own localhost:8265; the port-forward is exercised by the Step 5 check, which reads the dashboard's /api/jobs/ (the API behind the Recent jobs pane)"
      - "doc-bug: Step 3's output shows MEMORY 3G (and Step 4 shows memory 3000000000.0), and Preparation asks for 4 GB RAM, but since #4588 (v1.7.0) the ray-cluster chart requests 5Gi for the head and 1Gi for the worker, 6Gi in total"
    steps:
      - name: Install the KubeRay operator (operator-installation page, Helm)
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          kubectl create namespace ray-system
          helm install kuberay-operator kuberay/kuberay-operator --version $CHART_VERSION -n ray-system
          kubectl wait deploy/kuberay-operator -n ray-system --for=condition=Available --timeout=300s
          kubectl get pods -n ray-system
        check: kubectl wait pod -n ray-system -l app.kubernetes.io/name=kuberay-operator --for=condition=Ready --timeout=60s
      - name: Deploy a RayCluster custom resource
        run: helm install raycluster kuberay/ray-cluster --version $CHART_VERSION
        check: kubectl wait raycluster/raycluster-kuberay --for=jsonpath='{.status.state}'=ready --timeout=900s
        timeout: 900
      - name: View the RayCluster
        run: kubectl get rayclusters
        check: |
          test "$(kubectl get raycluster raycluster-kuberay -o jsonpath='{.status.desiredWorkerReplicas} {.status.availableWorkerReplicas} {.status.desiredCPU}')" = "1 1 2"
      - name: View the RayCluster's Pods
        run: kubectl get pods --selector=ray.io/cluster=raycluster-kuberay
        check: |
          kubectl wait pod -l ray.io/cluster=raycluster-kuberay --for=condition=Ready --timeout=300s
          test "$(kubectl get pods -l ray.io/cluster=raycluster-kuberay,ray.io/node-type=head -o name | wc -l)" -eq 1
          test "$(kubectl get pods -l ray.io/cluster=raycluster-kuberay,ray.io/node-type=worker -o name | wc -l)" -eq 1
      - name: "Method 1: print the cluster resources in the head Pod"
        run: |
          export HEAD_POD=$(kubectl get pods --selector=ray.io/node-type=head -o custom-columns=POD:metadata.name --no-headers)
          echo $HEAD_POD
          kubectl exec $HEAD_POD -- python -c "import ray; ray.init(); print(ray.cluster_resources())"
        check: |
          grep -q "'CPU': 2.0" "$OUT"
          test "$(grep -o "'node:[0-9]" "$OUT" | wc -l)" -eq 2
      - name: "Method 2: view the head Service"
        run: kubectl get service raycluster-kuberay-head-svc
        check: |
          kubectl get service raycluster-kuberay-head-svc -o jsonpath='{.spec.ports[*].port}' | grep -qw 8265
      - name: Port-forward the dashboard port
        run: kubectl port-forward service/raycluster-kuberay-head-svc 8265:8265 >/dev/null 2>&1 &
        check: curl -sf --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8265/api/version
      - name: "Method 2: submit a Ray job"
        run: |
          kubectl exec "$(kubectl get pod -l ray.io/node-type=head -o name)" -- ray job submit --address http://localhost:8265 -- python -c "import ray; ray.init(); print(ray.cluster_resources())"
        check: |
          grep -q "'CPU': 2.0" "$OUT"
          grep -q "Job '.*' succeeded" "$OUT"
      - name: Access the Ray dashboard and see the job in Recent jobs
        run: |
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null http://127.0.0.1:8265/
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8265/api/jobs/
        check: |
          test "$(yq -p json -o yaml '[.[] | select(.status == "SUCCEEDED" and (.entrypoint | contains("cluster_resources")))] | length' "$OUT")" -ge 1
    cleanup:
      - helm uninstall raycluster --wait
      - helm uninstall kuberay-operator -n ray-system --wait
      - kubectl delete crd rayclusters.ray.io rayjobs.ray.io rayservices.ray.io raycronjobs.ray.io --ignore-not-found
      - kubectl delete namespace ray-system --ignore-not-found

  - id: rayjob-quick-start
    source_sha: ab638faa167286514bb0f45eed8c9f627617bd57
    notes:
      - "Step 1 (kind create cluster --image=kindest/node:v1.26.0) and Step 10.3 (kind delete cluster) are left out: the runner owns the kind cluster"
      - "Step 2 follows the linked operator-installation page, Helm method, which installs into ray-system"
      - "The RayJob Configuration section is reference text without commands; only the example (Steps 3 to 10) runs"
      - "Step 5: kubectl logs with a selector prints only the last 10 lines per Pod; the check looks for the last counter line and the succeeded line, which are among them"
      - "doc-bug: Step 10.2 runs helm uninstall kuberay-operator without -n ray-system, but the operator-installation page that Step 2 links to installs the release into ray-system, so the command fails with release: not found; cleanup passes -n ray-system"
      - "doc-bug: Step 4.2's example output shows CPUS 400m and MEMORY 0, but ray-job.sample.yaml requests 1 CPU and 2Gi for the head and 200m CPU for the worker, so the RayCluster reports 1200m and 2Gi"
      - "doc-bug: RayJob Configuration says submissionMode has three possible values, then lists four (K8sJobMode, HTTPMode, InteractiveMode, SidecarMode)"
    steps:
      - name: Install the KubeRay operator (operator-installation page, Helm)
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          kubectl create namespace ray-system
          helm install kuberay-operator kuberay/kuberay-operator --version $CHART_VERSION -n ray-system
          kubectl wait deploy/kuberay-operator -n ray-system --for=condition=Available --timeout=300s
          kubectl get pods -n ray-system
        check: kubectl wait pod -n ray-system -l app.kubernetes.io/name=kuberay-operator --for=condition=Ready --timeout=60s
      - name: "Step 3: Install a RayJob"
        run: kubectl apply -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.sample.yaml
        check: kubectl wait rayjob/rayjob-sample --for=jsonpath='{.status.jobDeploymentStatus}'=Complete --timeout=900s
        timeout: 900
      - name: "Step 4.1: List the RayJobs"
        run: kubectl get rayjob
        check: |
          test "$(kubectl get rayjob rayjob-sample -o jsonpath='{.status.jobStatus} {.status.jobDeploymentStatus}')" = "SUCCEEDED Complete"
          test "$(kubectl get rayjob rayjob-sample -o jsonpath='{.status.rayClusterName} {.status.startTime} {.status.endTime}' | wc -w)" -eq 3
      - name: "Step 4.2: List the RayClusters"
        run: kubectl get raycluster
        check: |
          kubectl get rayjob rayjob-sample -o jsonpath='{.status.rayClusterName}' >rayjob-sample.raycluster
          test "$(kubectl get raycluster "$(cat rayjob-sample.raycluster)" -o jsonpath='{.status.desiredWorkerReplicas} {.status.availableWorkerReplicas} {.status.state}')" = "1 1 ready"
      - name: "Step 4.3: List the Pods"
        run: kubectl get pods
        check: |
          RC=$(cat rayjob-sample.raycluster)
          test "$(kubectl get pods -l job-name=rayjob-sample --field-selector=status.phase=Succeeded -o name | wc -l)" -ge 1
          test "$(kubectl get pods -l ray.io/cluster=$RC,ray.io/node-type=head --field-selector=status.phase=Running -o name | wc -l)" -eq 1
          test "$(kubectl get pods -l ray.io/cluster=$RC,ray.io/node-type=worker --field-selector=status.phase=Running -o name | wc -l)" -eq 1
      - name: "Step 4.4: Check the status of the RayJob"
        run: |
          kubectl get rayjobs.ray.io rayjob-sample -o jsonpath='{.status.jobStatus}'
          kubectl get rayjobs.ray.io rayjob-sample -o jsonpath='{.status.jobDeploymentStatus}'
        check: |
          grep -q SUCCEEDED "$OUT"
          grep -q Complete "$OUT"
      - name: "Step 5: Check the output of the Ray job"
        run: kubectl logs -l=job-name=rayjob-sample
        check: |
          grep -q 'test_counter got 5' "$OUT"
          grep -qE "Job '.*' succeeded" "$OUT"
      - name: "Step 6: Delete the RayJob"
        run: kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.sample.yaml
        check: kubectl wait --for=delete rayjob/rayjob-sample "raycluster/$(cat rayjob-sample.raycluster)" --timeout=300s
      - name: "Step 7: Create a RayJob with shutdownAfterJobFinishes set to true"
        run: kubectl apply -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.shutdown.yaml
        check: |
          test "$(kubectl get rayjob rayjob-sample-shutdown -o jsonpath='{.spec.shutdownAfterJobFinishes} {.spec.ttlSecondsAfterFinished}')" = "true 10"
          kubectl wait rayjob/rayjob-sample-shutdown --for=jsonpath='{.status.jobDeploymentStatus}'=Complete --timeout=900s
        timeout: 900
      - name: "Step 8: Check the RayJob status"
        run: |
          kubectl get rayjobs.ray.io rayjob-sample-shutdown -o jsonpath='{.status.jobDeploymentStatus}'
          kubectl get rayjobs.ray.io rayjob-sample-shutdown -o jsonpath='{.status.jobStatus}'
        check: |
          grep -q Complete "$OUT"
          grep -q SUCCEEDED "$OUT"
      - name: "Step 9: The KubeRay operator deletes the RayCluster and keeps the submitter Job"
        run: kubectl get raycluster
        check: |
          RC=$(kubectl get rayjob rayjob-sample-shutdown -o jsonpath='{.status.rayClusterName}')
          test -n "$RC"
          kubectl wait --for=delete "raycluster/$RC" --timeout=120s
          kubectl get job rayjob-sample-shutdown
      - name: "Step 10.1: Delete the RayJob, which deletes the submitter Job through its owner reference"
        run: kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.shutdown.yaml
        check: kubectl wait --for=delete rayjob/rayjob-sample-shutdown job/rayjob-sample-shutdown --timeout=120s
    cleanup:
      - kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.sample.yaml --ignore-not-found
      - kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.shutdown.yaml --ignore-not-found
      - helm uninstall kuberay-operator -n ray-system --wait
      - kubectl delete crd rayclusters.ray.io rayjobs.ray.io rayservices.ray.io raycronjobs.ray.io --ignore-not-found
      - kubectl delete namespace ray-system --ignore-not-found

  - id: rayservice-quick-start
    source_sha: 0f291f4d85a21efacb77d616a1f415b9a72bedb8
    notes:
      - "Step 1 (kind create cluster --image=kindest/node:v1.26.0) is left out: the runner owns the kind cluster"
      - "Step 2 follows the linked operator-installation page, Helm method, which installs into ray-system"
      - "Step 5 checks the Serve page through the API behind it, /api/serve/applications/, over the port-forward"
      - "Step 6.1 runs the curl Pod with sleep instead of an interactive sh (the runner has no TTY), and Steps 6.2 and 6.3 run through kubectl exec. curlimages/curl is pinned to 8.22.0 instead of latest. curl gets -sS so the progress meter stays out of the response, and retries because the Ready condition only needs one Serve endpoint"
      - "The serveConfigV2 working_dir is a zip on github.com that the Ray Pods download, so the RayService wait gets 900s"
      - "doc-bug: Step 7 runs helm uninstall kuberay-operator without -n ray-system, but the operator-installation page that Step 2 links to installs the release into ray-system, so the command fails with release: not found; cleanup passes -n ray-system"
      - "doc-bug: Prerequisites says the guide focuses on Ray 2.46.0, but ray-service.sample.yaml runs rayproject/ray:2.52.0"
    steps:
      - name: Install the KubeRay operator (operator-installation page, Helm)
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          kubectl create namespace ray-system
          helm install kuberay-operator kuberay/kuberay-operator --version $CHART_VERSION -n ray-system
          kubectl wait deploy/kuberay-operator -n ray-system --for=condition=Available --timeout=300s
          kubectl get pods -n ray-system
        check: kubectl wait pod -n ray-system -l app.kubernetes.io/name=kuberay-operator --for=condition=Ready --timeout=60s
      - name: "Step 3: Install a RayService"
        run: kubectl apply -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-service.sample.yaml
        check: kubectl wait rayservice/rayservice-sample --for=condition=Ready --timeout=900s
        timeout: 900
      - name: "Step 4.1: List the RayServices"
        run: kubectl get rayservice
        check: |
          kubectl wait rayservice/rayservice-sample --for=jsonpath='{.status.numServeEndpoints}'=2 --timeout=300s
          test "$(kubectl get rayservice rayservice-sample -o jsonpath='{.status.serviceStatus}')" = Running
      - name: "Step 4.2: List the RayClusters"
        run: kubectl get raycluster
        check: |
          kubectl get rayservice rayservice-sample -o jsonpath='{.status.activeServiceStatus.rayClusterName}' >rayservice-sample.raycluster
          test -s rayservice-sample.raycluster
          test "$(kubectl get raycluster "$(cat rayservice-sample.raycluster)" -o jsonpath='{.status.desiredWorkerReplicas} {.status.availableWorkerReplicas} {.status.desiredCPU} {.status.desiredMemory} {.status.state}')" = "1 1 2500m 4Gi ready"
      - name: "Step 4.3: List the RayCluster's Pods"
        run: kubectl get pods -l=ray.io/is-ray-node=yes
        check: |
          RC=$(cat rayservice-sample.raycluster)
          test "$(kubectl get pods -l ray.io/cluster=$RC,ray.io/node-type=head --field-selector=status.phase=Running -o name | wc -l)" -eq 1
          test "$(kubectl get pods -l ray.io/cluster=$RC,ray.io/node-type=worker,ray.io/group=small-group --field-selector=status.phase=Running -o name | wc -l)" -eq 1
      - name: "Step 4.4: Check the Ready condition of the RayService"
        run: kubectl describe rayservices.ray.io rayservice-sample
        check: |
          test "$(kubectl get rayservice rayservice-sample -o jsonpath='{.status.conditions[?(@.type=="Ready")].status} {.status.conditions[?(@.type=="Ready")].reason}')" = "True NonZeroServeEndpoints"
      - name: "Step 4.5: List the Services"
        run: kubectl get services
        check: |
          kubectl get service rayservice-sample-head-svc -o jsonpath='{.spec.ports[*].port}' | grep -qw 8265
          kubectl get service rayservice-sample-serve-svc -o jsonpath='{.spec.ports[*].port}' | grep -qw 8000
          kubectl get service "$(cat rayservice-sample.raycluster)-head-svc"
      - name: "Step 5: Forward the dashboard port"
        run: kubectl port-forward svc/rayservice-sample-head-svc 8265:8265 >/dev/null 2>&1 &
        check: curl -sf --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8265/api/version
      - name: "Step 5: The Serve page shows both applications running"
        run: curl -sf --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8265/api/serve/applications/
        check: |
          test "$(yq -p json '.applications.fruit_app.status' "$OUT")" = RUNNING
          test "$(yq -p json '.applications.math_app.status' "$OUT")" = RUNNING
      - name: "Step 6.1: Run a curl Pod"
        run: kubectl run curl --image=curlimages/curl:8.22.0 -- sleep 3600
        check: kubectl wait pod/curl --for=condition=Ready --timeout=300s
      - name: "Step 6.2: Send a request to the fruit stand app"
        run: |
          kubectl exec curl -- curl -sS --fail --retry 10 --retry-delay 2 --retry-all-errors -X POST -H 'Content-Type: application/json' rayservice-sample-serve-svc:8000/fruit/ -d '["MANGO", 2]'
        check: grep -qx '6' "$OUT"
      - name: "Step 6.3: Send a request to the calculator app"
        run: |
          kubectl exec curl -- curl -sS --fail --retry 10 --retry-delay 2 --retry-all-errors -X POST -H 'Content-Type: application/json' rayservice-sample-serve-svc:8000/calc/ -d '["MUL", 3]'
        check: grep -qxF '"15 pizzas please!"' "$OUT"
      - name: "Step 7: Delete the RayService and the curl Pod"
        run: |
          kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-service.sample.yaml
          kubectl delete pod curl
        check: kubectl wait --for=delete rayservice/rayservice-sample "raycluster/$(cat rayservice-sample.raycluster)" pod/curl --timeout=300s
    cleanup:
      - kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-service.sample.yaml --ignore-not-found
      - kubectl delete pod curl --ignore-not-found
      - helm uninstall kuberay-operator -n ray-system --wait
      - kubectl delete crd rayclusters.ray.io rayjobs.ray.io rayservices.ray.io raycronjobs.ray.io --ignore-not-found
      - kubectl delete namespace ray-system --ignore-not-found

  - id: ray-cluster-sample
    source_sha: 1d35341e539132725fa424f070e3ec660396b527
    notes:
      - "sample-bug: the worker group's comment says it is called small-group, but groupName is workergroup"
    steps:
      - name: Install the KubeRay operator (operator-installation page, Helm)
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          kubectl create namespace ray-system
          helm install kuberay-operator kuberay/kuberay-operator --version $CHART_VERSION -n ray-system
          kubectl wait deploy/kuberay-operator -n ray-system --for=condition=Available --timeout=300s
        check: kubectl wait pod -n ray-system -l app.kubernetes.io/name=kuberay-operator --for=condition=Ready --timeout=60s
      - name: Apply the sample
        run: kubectl apply -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-cluster.sample.yaml
        check: kubectl wait raycluster/raycluster-kuberay --for=jsonpath='{.status.state}'=ready --timeout=900s
        timeout: 900
      - name: One head Pod and one worker Pod run
        run: kubectl get pods -l ray.io/cluster=raycluster-kuberay
        check: |
          test "$(kubectl get pods -l ray.io/cluster=raycluster-kuberay,ray.io/node-type=head --field-selector=status.phase=Running -o name | wc -l)" -eq 1
          test "$(kubectl get pods -l ray.io/cluster=raycluster-kuberay,ray.io/node-type=worker --field-selector=status.phase=Running -o name | wc -l)" -eq 1
      - name: The head and the worker form one Ray cluster
        run: |
          kubectl exec "$(kubectl get pod -l ray.io/cluster=raycluster-kuberay,ray.io/node-type=head -o name)" -- python -c "import ray; ray.init(); print('alive_nodes', sum(n['Alive'] for n in ray.nodes())); print(ray.cluster_resources())"
        check: |
          grep -qx 'alive_nodes 2' "$OUT"
          grep -q "'CPU': 2.0" "$OUT"
    cleanup:
      - kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-cluster.sample.yaml --ignore-not-found
      - helm uninstall kuberay-operator -n ray-system --wait
      - kubectl delete crd rayclusters.ray.io rayjobs.ray.io rayservices.ray.io raycronjobs.ray.io --ignore-not-found
      - kubectl delete namespace ray-system --ignore-not-found

  - id: go-get-ray-operator
    source_sha: 5e7967e40029750ea790ebd45aaee812bcd8b1db
    notes:
      - "Needs no cluster, only go on the runner host. With GOTOOLCHAIN=auto (the default), go fetches the toolchain that ray-operator/go.mod asks for (go 1.26.0 at HEAD)"
      - "go get resolves @$KUBERAY_VERSION through the tag ray-operator/$KUBERAY_VERSION, because the module lives in a subdirectory. docs/development/release.md only creates vX.Y.Z, so a failure in step 1 most likely means the ray-operator/ tag was not pushed"
    steps:
      - name: go get the ray-operator module in an empty Go module
        run: |
          mkdir gomod && cd gomod
          go mod init example.com/raycluster
          go get github.com/ray-project/kuberay/ray-operator@$KUBERAY_VERSION
        check: |
          cd gomod
          test "$(go list -m -f '{{.Version}}' github.com/ray-project/kuberay/ray-operator)" = "$KUBERAY_VERSION"
        timeout: 600
      - name: A main package that imports apis/ray/v1 and builds a RayCluster value compiles
        run: |
          cd gomod
          cat >main.go <<'EOF'
          package main

          import (
          	"fmt"

          	metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"

          	rayv1 "github.com/ray-project/kuberay/ray-operator/apis/ray/v1"
          )

          func main() {
          	cluster := rayv1.RayCluster{
          		ObjectMeta: metav1.ObjectMeta{Name: "raycluster-go-get"},
          		Spec: rayv1.RayClusterSpec{
          			HeadGroupSpec:    rayv1.HeadGroupSpec{RayStartParams: map[string]string{}},
          			WorkerGroupSpecs: []rayv1.WorkerGroupSpec{{GroupName: "workergroup"}},
          		},
          	}
          	fmt.Println(cluster.Name, len(cluster.Spec.WorkerGroupSpecs))
          }
          EOF
          go mod tidy
          go build -buildvcs=false -o raycluster .
          ./raycluster
        check: grep -qx 'raycluster-go-get 1' "$OUT"
        timeout: 600
