# Strategic merge patch for kuberay-operator Deployment.
# Enables the Kubernetes workload-aware scheduling v1alpha3 batch scheduler plugin
# via the KubernetesWAS feature gate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberay-operator
spec:
  template:
    spec:
      containers:
      - name: kuberay-operator
        args:
        - --feature-gates=RayClusterStatusConditions=true,RayJobDeletionPolicy=true,RayMultiHostIndexing=true,RayCronJob=true,RayServiceIncrementalUpgrade=true,SidecarSubmitterRestart=true,KubernetesWAS=true
