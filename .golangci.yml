version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - errcheck
    - ginkgolinter
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - modernize
    - nilerr
    - nolintlint
    - predeclared
    - testifylint
    - unconvert
    - unparam
    - unused
    - wastedassign
    - errorlint
    - staticcheck
    - noctx
    - revive
  settings:
    staticcheck:
      checks: ["all", "-ST1001", "-ST1003", "-ST1005", "-QF1008"]
    ginkgolinter:
      forbid-focus-container: true
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G601
    lll:
      line-length: 120
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          disabled: true
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
          arguments:
            - ["ID", "JSON", "HTTP", "IP"] # AllowList
            - [] # DenyList
            - - upperCaseConst: true
          exclude:
            - '**/ray-operator/apis/config/v1alpha1/*.go'
            - '**/ray-operator/apis/ray/v1alpha1/*.go'
            - '**/ray-operator/apis/ray/v1/*.go'
            - '**/ray-operator/controllers/ray/batchscheduler/utils/*.go'
            - '**/ray-operator/controllers/ray/common/*.go'
            - '**/ray-operator/controllers/ray/utils/*.go'
            - '**/ray-operator/pkg/utils/*.go'
            - '**/ray-operator/controllers/ray/utils/types/*.go'
            - '**/apiserver/pkg/http/*.go'
            - '**/apiserver/pkg/util/*.go'
            - '**/apiserversdk/util/*.go'
            - '**/kubectl-plugin/pkg/util/*.go'
    modernize:
      disable:
        - omitzero
  exclusions:
    # Suppress SA1019 for the project's own deprecated API fields that are
    # intentionally maintained for backward compatibility. External deprecated
    # API usage (e.g., from third-party libraries) will still be caught.
    rules:
      - linters: [staticcheck]
        text: "SA1019:.*\\.State is deprecated: the State field"
      - linters: [staticcheck]
        text: "SA1019:.*\\.ServiceStatus is deprecated"
      - linters: [staticcheck]
        text: "SA1019:.*ServiceUnhealthySecondThreshold is deprecated"
      - linters: [staticcheck]
        text: "SA1019:.*DeploymentUnhealthySecondThreshold is deprecated"
      # NewSimpleClientset is deprecated in favor of NewClientset, but
      # NewClientset requires complete structured-merge-diff type schemas
      # for field management which breaks Update-based tests.
      # TODO(#4627): migrate once SMD schemas are properly generated.
      - linters: [staticcheck]
        text: "SA1019:.*NewSimpleClientset"
      # ---------------------------------------------------------------------
      # historyserver/ lint baseline.
      # TODO(#4813): burn this list down.
      # ---------------------------------------------------------------------
      # SessionKey is a Ray session identifier (raycluster_ns_session_<timestamp>),
      # not a credential; gosec's secret-name heuristic misfires on it.
      - linters: [gosec]
        path: historyserver/
        text: 'G117:.*"SessionKey"'
      # The history server S3 backend and its e2e tests still use aws-sdk-go v1.
      # TODO: drop this once the S3 storage backend migrates to aws-sdk-go-v2.
      - linters: [staticcheck]
        path: historyserver/
        text: "SA1019:.*aws-sdk-go is deprecated"
      # TODO: handle these properly instead of ignoring them.
      - linters: [errcheck]
        path: historyserver/
        text: 'Error return value of `(resp|r2|w)\.Write(AsJson|Error|ErrorString|HeaderAndEntity|Json)?` is not checked'
      # Ray spells it this way in its ErrorType enum and raylet debug_state output.
      - linters: [misspell]
        path: historyserver/
        text: '(?i)`cancelled` is a misspelling'
      # The rules below cover findings that need a real code or design change
      # rather than a mechanical edit. Each names what that change is; delete the
      # rule once it lands.
      - linters: [noctx]
        path: '^historyserver/test/'

      - linters: [nilerr]
        path: '^historyserver/pkg/(collector/eventcollector/eventcollector|utils/utils)\.go$'

      - linters: [gosec]
        path: '^historyserver/pkg/(historyserver/router|utils/auth)\.go$'
        text: '^G101:'

      - linters: [gosec]
        path: '^historyserver/pkg/compression/compression\.go$'
        text: '^G110:'

      - linters: [gosec]
        path: '^historyserver/pkg/collector/eventcollector/eventcollector\.go$'
        text: '^G(114|122):'

      - linters: [gosec]
        path: '^historyserver/cmd/collector/main\.go$'
        text: '^G703:'

      - linters: [gosec]
        path: '^historyserver/pkg/utils/utils\.go$'
        text: '^G704:'

      - linters: [unused]
        path: '^historyserver/test/'

    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - _generated.go
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci: # Splits all import blocks into different sections and sorts them.
      sections:
        - standard # Go official imports, like "fmt"
        - default # Third-party libraries (anything not in standard or prefix)
        - prefix(github.com/ray-project/kuberay) # kuberay packages
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/ray-project/kuberay
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
run:
  # timeout for analysis, e.g. 30s, 5m, default timeout is disabled
  timeout: 10m
